<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullylife Solutions — Accesso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#f4f5f7;--panel:#fff;--ink:#1d2733;--ink-soft:#5b6876;--line:#e2e6ea;--accent:#2f6f8f;--accent-ink:#1f4d63;--danger:#b3403a;--radius:10px;--font:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;--ui:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh;}
  .center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{width:100%;max-width:380px;}
  .brand{text-align:center;margin-bottom:22px;}
  .brand .mark{width:46px;height:46px;border-radius:11px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px;}
  .brand h1{font-family:var(--font);font-size:21px;margin:0;font-weight:600;}
  .brand p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  input{width:100%;padding:10px 12px;font-size:14px;font-family:var(--ui);border:1px solid var(--line);border-radius:7px;margin-bottom:14px;background:#fcfcfd;color:var(--ink);}
  input:focus{outline:none;border-color:var(--accent);}
  button.primary{padding:11px 16px;font-size:14px;font-family:var(--ui);background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;font-weight:500;width:100%;}
  button.primary:hover{background:var(--accent-ink);}
  button.primary:disabled{opacity:.6;cursor:default;}
  .msg{font-size:13px;margin-bottom:12px;padding:9px 11px;border-radius:7px;display:none;}
  .msg.err{display:block;background:#f7e9e8;color:var(--danger);}
  .foot-note{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:16px;line-height:1.6;}
  .apps-wrap{width:100%;max-width:520px;}
  .apps-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
  .apps-head .who{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  button.ghost{padding:7px 12px;font-size:13px;font-family:var(--ui);background:transparent;color:var(--ink-soft);border:1px solid var(--line);border-radius:7px;cursor:pointer;}
  button.ghost:hover{background:#fff;color:var(--ink);}
  .apps-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:520px){.apps-grid{grid-template-columns:1fr;}}
  .app-card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px 20px;text-align:center;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s;}
  .app-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .app-card .ic{font-size:32px;margin-bottom:10px;}
  .app-card .t{font-size:15px;font-weight:600;font-family:var(--font);}
  .app-card .d{font-size:12px;color:var(--ink-soft);margin-top:4px;}
</style>
</head>
<body>
<div class="center-wrap">
  <div class="wrap" id="login-view">
    <div class="brand"><div class="mark">◐</div><h1>Fullylife Solutions</h1><p>Hub d'accesso</p></div>
    <div class="card">
      <div id="login-msg" class="msg"></div>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" placeholder="nome@dominio.it">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      <button class="primary" id="login-btn">Accedi</button>
    </div>
    <p class="foot-note">Accesso riservato a consulenti e amministratori Fullylife Solutions.</p>
  </div>
  <div class="apps-wrap" id="apps-view" style="display:none">
    <div class="apps-head">
      <div class="brand" style="text-align:left;margin-bottom:0">
        <h1 style="font-size:18px">Fullylife Solutions</h1>
        <p class="who" id="who-email">—</p>
      </div>
      <button class="ghost" id="logout-btn">Esci</button>
    </div>
    <div class="apps-grid">
      <a class="app-card" id="card-gestionale" href="#">
        <div class="ic">📄</div>
        <div class="t">Gestionale / Fatturazione</div>
        <div class="d">Preventivi, fatture, clienti</div>
      </a>
      <a class="app-card" id="card-gespp" href="#">
        <div class="ic">◐</div>
        <div class="t">GESPP</div>
        <div class="d">Profilazione, calendario, team</div>
      </a>
    </div>
  </div>
</div>
<script>
// Stesso pattern di init Supabase e selezione ambiente usato in
// gestionale_fullylife.html e spp_dashboard.html — copiato 1:1 (stesso
// progetto Supabase, stessa sessione condivisa, vedi ricognizione).
const SUPABASE_ENV = window.location.hostname.includes('github.io')
  ? { url: 'https://atpsnetvtefqsiaptnaf.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0cHNuZXR2dGVmcXNpYXB0bmFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzc3NzMsImV4cCI6MjEwNDcxMzc3M30.KxSP7LxbiJXjmz55UrdJLl89LEaKN3tAJUt8eTLXA14' }
  : { url: 'https://rronmtbpvhetoiddynmz.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyb25tdGJwdmhldG9pZGR5bm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NDA4NzEsImV4cCI6MjA5NjQxNjg3MX0.MVqdH3aTlXWukzZCbv171uaqiiF3n6wmK3KfYoitlpA' };
const SUPABASE_URL = SUPABASE_ENV.url;
const SUPABASE_ANON_KEY = SUPABASE_ENV.key;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const el = id => document.getElementById(id);

// Base = cartella che contiene questa pagina, derivata dall'URL corrente
// (mai hardcodata su prod): in produzione e' la radice dell'org
// (fullylifesolutions.github.io/), in locale e' la cartella dove si apre
// questo file. In entrambi i casi gestionale-fullylife/ e GESPP/ sono
// pubblicati come sottopercorsi dello stesso host (vedi ricognizione).
const APP_BASE = window.location.href.replace(/[^/]*$/, '');
const GESTIONALE_URL = APP_BASE + 'gestionale-fullylife/gestionale_fullylife.html';
const GESPP_URL = APP_BASE + 'GESPP/spp_dashboard.html';

function showLogin(){
  el('login-view').style.display='block';
  el('apps-view').style.display='none';
}
function showApps(email){
  el('login-view').style.display='none';
  el('apps-view').style.display='block';
  el('who-email').textContent=email||'';
  el('card-gestionale').href=GESTIONALE_URL;
  el('card-gespp').href=GESPP_URL;
}
async function doLogin(){
  const btn=el('login-btn'), msg=el('login-msg');
  msg.className='msg'; btn.disabled=true; btn.textContent='Accesso in corso…';
  const {data,error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});
  btn.disabled=false; btn.textContent='Accedi';
  if(error){ msg.textContent='Credenziali non valide. Riprova.'; msg.className='msg err'; return; }
  showApps(data.user && data.user.email);
}
async function doLogout(){
  await sb.auth.signOut();
  el('email').value=''; el('password').value='';
  showLogin();
}
async function checkSession(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) showApps(session.user.email); else showLogin();
}

el('login-btn').addEventListener('click', doLogin);
el('password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
el('logout-btn').addEventListener('click', doLogout);

checkSession();
</script>
</body>
</html>
